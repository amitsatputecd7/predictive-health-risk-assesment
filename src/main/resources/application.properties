# Server Configuration
server.port=8080
server.servlet.context-path=/

# Azure SQL Server Database Configuration
spring.datasource.url=jdbc:sqlserver://phra-35.database.windows.net:1433;database=customer-details;user=admin123@phra-35;password=${AZURE_SQL_PASSWORD:Admin@123};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# SQL initialization
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Logging Configuration
logging.level.com.hackforjob.metlife.predictive_health_risk_assesment=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Application Configuration
spring.application.name=predictive-health-risk-assessment

# JSON Configuration
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=NON_NULL

# Validation Configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# JWT Configuration
jwt.secret=myVerySecretKeyForJWTTokenGeneration123456789abcdefghijklmnopqrstuvwxyz
jwt.expiration=86400
