name: CI - Build and Test

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: predictive_health_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw clean compile -DskipTests
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Run tests
        run: ./mvnw test
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/predictive_health_db

      - name: Package application
        run: ./mvnw package -DskipTests
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: predictive-health-risk-assessment-war
          path: target/*.war
          retention-days: 7
