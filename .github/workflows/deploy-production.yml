name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.app-url }}
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: predictive_health_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.version }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build application
        run: ./mvnw clean package -DskipTests
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Run tests
        run: ./mvnw test
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/predictive_health_db

      - name: Run integration tests
        run: ./mvnw verify -DskipUnitTests
        continue-on-error: true
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/predictive_health_db

      - name: Create backup
        run: |
          echo "Creating backup of current production deployment..."
          # Add backup commands here
          # For example, backup current WAR file, database snapshot, etc.

      - name: Deploy to Production
        id: deploy
        run: |
          echo "Deploying to production environment..."
          echo "Version: ${{ github.event.release.tag_name || github.event.inputs.version }}"
          echo "WAR file: $(ls target/*.war)"
          echo "app-url=https://predictive-health-risk-assessment.example.com" >> $GITHUB_OUTPUT
          # Add your deployment commands here
          # For example: scp, rsync, AWS CLI, Azure CLI, etc.
          # Example for Tomcat:
          # scp target/*.war user@prod-server:/path/to/tomcat/webapps/
          # Or for cloud platforms:
          # aws s3 cp target/*.war s3://bucket-name/
          # az webapp deployment source config-zip --resource-group rg --name app-name --src target/*.war

      - name: Run smoke tests
        run: |
          echo "Running smoke tests on production environment..."
          # Add smoke test commands here
          # curl -f https://predictive-health-risk-assessment.example.com/actuator/health

      - name: Notify deployment
        run: |
          echo "✅ Deployment to production environment completed successfully!"
          echo "📦 Version: ${{ github.event.release.tag_name || github.event.inputs.version }}"
          echo "📦 Artifact: $(ls target/*.war)"
          echo "🔗 Application URL: https://predictive-health-risk-assessment.example.com"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "⚠️ Deployment failed! Initiating rollback..."
          # Add rollback commands here
          # Restore previous version from backup
